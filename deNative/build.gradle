apply plugin: 'com.android.library'

android {
    compileSdkVersion android_build_sdk_version
    buildToolsVersion android_build_tools_version
    ndkVersion '26.3.11579264'

    defaultConfig {
        minSdkVersion android_build_min_sdk_version
        targetSdkVersion android_build_target_sdk_version

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
    }

    namespace 'ap.andruav.denative'

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Verifies the pinned upstream sources and the third-party deps are in place
// before the native build runs (see deNative/sources.lock).
def deLocalProps = new Properties()
rootProject.file('local.properties').withInputStream { deLocalProps.load(it) }
def deAndroidHome = System.getenv('ANDROID_HOME') ?: deLocalProps.getProperty('sdk.dir')
def deThirdPartyOut = new File(projectDir, 'third_party/out')

// Fails the build (non-zero exit) when external/ is out of sync; the script
// prints 'run deNative/sync_sources.sh' as the actionable message.
tasks.register('deNativeCheckSync', Exec) {
    workingDir projectDir
    commandLine 'bash', 'sync_sources.sh', '--check'
}

tasks.register('deNativeDeps', Exec) {
    onlyIf { !deThirdPartyOut.isDirectory() }
    workingDir projectDir
    environment 'ANDROID_HOME', deAndroidHome
    commandLine 'bash', 'third_party/build_deps.sh'
}

tasks.register('deNativePrepare') {
    dependsOn 'deNativeCheckSync', 'deNativeDeps'
}

tasks.named('preBuild') {
    dependsOn 'deNativePrepare'
}
